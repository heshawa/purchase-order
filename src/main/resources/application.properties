spring.application.name=purchaseOrder
server.port=8081
server.

# H2 database configuration
spring.datasource.url=jdbc:h2:file:./data/orderDB
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=adminOrder
spring.datasource.password=

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# External API configuration
inventory.api.base-url=http://localhost:8080/inventory

# Show SQL in console (optional)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 web console (optional)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console